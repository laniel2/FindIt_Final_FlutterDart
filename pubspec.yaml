name: findit
description: FindIt - a school lost and found mobile application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3   # local storage (NO MySQL) - users, session, items
  http: ^1.2.1                 # API integration
  image_picker: ^1.1.2         # camera / gallery for item photos and avatar
  path_provider: ^2.1.3        # save picked photos permanently on device
  crypto: ^3.0.3               # password hashing
  intl: ^0.19.0                # date formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
